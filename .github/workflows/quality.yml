name: Website quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: elamal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d elamal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CMS_ENABLED: 'false'
      CATALOGUE_SOURCE: demo
      SITE_INDEXING_ENABLED: 'false'
      PUBLIC_ENQUIRIES_ENABLED: 'false'
      SITE_URL: https://el-amal-sigma.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Unit and permission checks
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Dependency advisory gate
        run: npm audit --audit-level=low
      - name: Migrate disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/elamal_ci
          PAYLOAD_SECRET: isolated-ci-secret-with-no-production-authority-0123456789
        run: node node_modules/payload/bin.js migrate
      - name: Stock and report database regressions
        env:
          CMS_DATABASE_CHECK: development
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/elamal_ci
          PAYLOAD_SECRET: isolated-ci-secret-with-no-production-authority-0123456789
        run: |
          node --experimental-strip-types scripts/check-inventory.ts
          node --experimental-strip-types scripts/check-demand-report.ts
      - name: Production build with isolated CMS
        env:
          CMS_ENABLED: 'true'
          CATALOGUE_SOURCE: cms
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/elamal_ci
          PAYLOAD_SECRET: isolated-ci-secret-with-no-production-authority-0123456789
        run: npm run build
      - name: Built CMS route regression
        env:
          CMS_ENABLED: 'true'
          CATALOGUE_SOURCE: cms
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/elamal_ci
          PAYLOAD_SECRET: isolated-ci-secret-with-no-production-authority-0123456789
        run: node scripts/check-built-server.mjs
